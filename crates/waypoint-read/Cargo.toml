[package]
name = "waypoint-read"
description = "Waypoint's shared types and read-only queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# No dependencies on other Waypoint crates, not even dev-dependencies (ADR 0001
# §2). Anything may depend on this crate, so it must not reach the write code.
# The two below are outside libraries: `workspace = true` only means "use the
# version written in the root Cargo.toml".
[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
